name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scanners:
    name: Source and dependency security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history with checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          scanner_root="$(mktemp -d "$RUNNER_TEMP/SteamSwitchboard-gitleaks.XXXXXX")"
          trap 'rm -rf -- "$scanner_root" "$archive"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz'
          printf '%s  %s\n' \
            '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$scanner_root" gitleaks

          canary_root="$scanner_root/canary"
          mkdir -- "$canary_root"
          printf '%s\n%s\n%s\n' \
            '-----BEGIN '"PRIVATE KEY-----" \
            'VGhpcyBpcyBhIGZha2UgZGV0ZWN0aW9uIGNhbmFyeSwgbm90IGEga2V5Lg==' \
            '-----END '"PRIVATE KEY-----" > "$canary_root/canary.pem"
          set +e
          "$scanner_root/gitleaks" dir \
            --no-banner \
            --redact=100 \
            --exit-code 7 \
            "$canary_root"
          canary_status=$?
          set -e
          if [[ "$canary_status" -ne 7 ]]; then
            echo "Gitleaks detection canary failed with exit code $canary_status." >&2
            exit 1
          fi
          rm -rf -- "$canary_root"

          "$scanner_root/gitleaks" git \
            --no-banner \
            --redact=100 \
            --exit-code 1 \
            --log-opts='--all' \
            .

      - name: Install Python for Semgrep
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install pinned Semgrep
        shell: bash
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0

      - name: Scan C# source with Semgrep
        shell: bash
        run: >-
          semgrep scan
          --config p/csharp
          --config p/security-audit
          --metrics off
          --no-git-ignore
          --error
          src tests

      - name: Scan dependencies, secrets, and configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          version: v0.74.0

  windows-release:
    name: Windows Release gate
    needs: security-scanners
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ContinuousIntegrationBuild: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RestoreLockedMode: 'true'
      TreatWarningsAsErrors: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.317
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages
        shell: pwsh
        run: dotnet restore ./SteamSwitchboard.sln --locked-mode

      - name: Build, test, and run security audit
        shell: pwsh
        run: ./scripts/security-audit.ps1 -Configuration Release

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
          }

          $tagVersion = $Matches.version
          [xml] $project = Get-Content -LiteralPath './src/SteamSwitchboard.App/SteamSwitchboard.App.csproj' -Raw
          $projectVersions = @(
            $project.Project.PropertyGroup |
              ForEach-Object { [string]$_.Version } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          if ($projectVersions.Count -ne 1) {
            throw 'Expected exactly one Version element in SteamSwitchboard.App.csproj.'
          }

          $projectVersion = $projectVersions[0]
          if ($tagVersion -cne $projectVersion) {
            throw "Release tag version '$tagVersion' does not match project version '$projectVersion'."
          }

      - name: Build, validate, and prove reproducible Windows package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Configuration Release -Runtime win-x64
          [xml] $project = Get-Content -LiteralPath './src/SteamSwitchboard.App/SteamSwitchboard.App.csproj' -Raw
          $version = @(
            $project.Project.PropertyGroup |
              ForEach-Object { [string]$_.Version } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )[0]
          $archive = "./artifacts/release/SteamSwitchboard-$version-win-x64.zip"
          $firstHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash

          dotnet clean ./SteamSwitchboard.sln --configuration Release
          ./scripts/package.ps1 -Configuration Release -Runtime win-x64
          $secondHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($firstHash -cne $secondHash) {
            throw "Package reproducibility check failed: $firstHash != $secondHash"
          }
          Write-Host "Reproducible package SHA-256: $secondHash"
